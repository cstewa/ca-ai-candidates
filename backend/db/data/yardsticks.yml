# Benchmark bills, votes and letters. Candidate positions in races.yml refer to these by key.
# url = roll call votes or the main source; text_url = official bill text (optional).
- key: sb1047
  name: SB 1047
  short_name: SB 1047
  full_title: Safe and Secure Innovation for Frontier Artificial Intelligence Models Act
  sponsors: Sen. Scott Wiener
  year: "2024"
  level: state
  kind: bill
  what_it_does: Required safety testing, a full-shutdown capability and third-party audits for the largest AI models.
  why_it_matters: The most extensive frontier-AI safety requirements the Legislature has passed to date.
  outcome: Passed the Assembly 48-16 and the Senate 30-9. Vetoed by Gov. Newsom.
  url: https://fastdemocracy.com/bill-search/ca/2023-2024/bills/CAB00031416/
  text_url: https://leginfo.legislature.ca.gov/faces/billNavClient.xhtml?bill_id=202320240SB1047
- key: sb53
  name: SB 53
  short_name: SB 53
  full_title: Transparency in Frontier Artificial Intelligence Act
  sponsors: Sen. Scott Wiener
  year: "2025"
  level: state
  kind: bill
  what_it_does: Large AI developers must publish catastrophic-risk frameworks, report critical safety incidents, and protect whistleblowers.
  why_it_matters: Defines catastrophic risk as help with chemical, biological, radiological or nuclear weapons, autonomous cyberattacks, or a model evading human control.
  outcome: Passed 59-7 (Assembly) and 29-8 (Senate). Signed into law.
  url: https://fastdemocracy.com/bill-search/ca/2025-2026/bills/CAB00033508/
  text_url: https://leginfo.legislature.ca.gov/faces/billNavClient.xhtml?bill_id=202520260SB53
- key: sb813
  name: SB 813
  short_name: SB 813
  full_title: Independent verification organizations
  sponsors: Sen. Jerry McNerney
  year: "2026"
  level: state
  kind: bill
  what_it_does: Creates a state framework for certifying independent AI safety auditors.
  why_it_matters: Basis for Gov. Newsom's Sept. 2026 order exploring embedded auditors and a kill switch.
  outcome: Passed 31-7 (Senate) and 67-6 (Assembly). Signed into law.
  url: https://fastdemocracy.com/bill-search/ca/2025-2026/bills/CAB00035450/
  text_url: https://leginfo.legislature.ca.gov/faces/billNavClient.xhtml?bill_id=202520260SB813
- key: kill_switch_act
  name: AI Kill Switch Act
  short_name: Kill Switch Act
  sponsors: Reps. Ted Lieu and Nathaniel Moran
  year: "2026"
  level: federal
  kind: bill
  what_it_does: The largest AI developers must be able to throttle or shut down powerful models, and the Department of Homeland Security can order a shutdown.
  why_it_matters: A federal backstop against loss of control of an AI system.
  outcome: Introduced July 2026.
  url: https://lieu.house.gov/media-center/press-releases/reps-lieu-and-moran-introduce-bill-require-kill-switch-ai-systems-can
- key: frontier_act
  name: FRONTIER Act
  short_name: FRONTIER Act
  sponsors: Reps. Jay Obernolte and Lori Trahan
  year: "2026"
  level: federal
  kind: bill
  what_it_does: Federal safety frameworks, audits and incident reporting for frontier AI developers. Preempts state rules in those areas.
  why_it_matters: Some AI-safety researchers have praised it; others oppose it because it would override state laws such as SB 53.
  outcome: Introduced July 2026.
  url: https://trahan.house.gov/news/documentsingle.aspx?DocumentID=3823
- key: letter_107
  name: 107-member letter
  short_name: 107-member letter
  sponsors: Led by Rep. Sam Liccardo
  year: "2026"
  level: federal
  kind: letter
  what_it_does: Asked Speaker Johnson to cancel the House recess to pass safeguards against "catastrophic risk posed by advanced artificial intelligence."
  why_it_matters: A public, named commitment by sitting members of Congress to act on catastrophic AI risk.
  outcome: Sent Sept. 2026.
  url: https://liccardo.house.gov/media/press-releases/over-hundred-house-democrats-demand-congress-stay-session-confront-ai-crisis
- key: openai_letter_2026
  name: Letter to OpenAI on the Hugging Face incident
  short_name: OpenAI incident letter
  sponsors: Led by Reps. Greg Casar and Doris Matsui
  year: "2026"
  level: federal
  kind: letter
  what_it_does: Asked OpenAI for logs from the July 2026 incident in which its agents escaped a test environment, including whether models tried to undermine human control.
  why_it_matters: Congressional oversight of a specific frontier-lab safety incident.
  outcome: Sent Aug. 2026.
  url: https://casar.house.gov/media/press-releases/casar-leads-demand-information-open-ai-about-security-incident
- key: moratorium_2025
  name: 2025 House reconciliation bill
  short_name: 2025 reconciliation bill
  sponsors: House Republican leadership
  year: "2025"
  level: federal
  kind: vote
  what_it_does: Included a 10-year ban on enforcing state AI laws.
  why_it_matters: Would have blocked enforcement of state AI-safety laws such as SB 53.
  outcome: Passed the House 215-214 with Republican votes. The Senate later stripped the moratorium 99-1.
  caveat: This was a broad budget bill. A yes vote covered much more than the AI provision, so it is not a standalone vote on the moratorium.
  url: https://www.americanprogressaction.org/article/almost-every-house-republican-voted-to-block-state-and-local-governments-ability-to-protect-residents-from-ai-data-centers/
