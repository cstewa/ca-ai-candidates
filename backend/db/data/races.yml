- office: governor
  candidates:
  - name: Xavier Becerra
    sort_name: Becerra
    party: D
    status: on_record
    items:
    - text: Released an 11-point AI plan in May 2026. It says California cannot accept AI that "poses catastrophic risks to public safety" and promises guardrails against harms "when AI accelerates dangerous capabilities or operates beyond human oversight." [[source]](https://www.xavierbecerra2026.com/priorities/ai/)
      kind: platform
    - text: Asked by CalMatters (Sept. 2026) whether he backs a kill switch and third-party monitoring, his campaign said only that he would enforce existing AI safety laws, close gaps, and strengthen standards. He declined an interview. [[source]](https://calmatters.org/politics/2026/09/california-governor-race-ai-safety/)
      kind: statement
    - text: Plan also calls for a national AI framework, a state cloud-computing cluster, independent audits of AI used by state government, and transparency for automated job decisions. [[source]](https://www.yahoo.com/news/articles/xavier-becerra-unveils-ai-vision-130000867.html)
      kind: platform
    - text: Encode AI (sponsor of SB 53) is a campaign donor and called itself "cautiously optimistic" about him. [[source]](https://calmatters.org/politics/2026/09/california-governor-race-ai-safety/)
      kind: funding
    - text: At the Sept. 30 debate he likened Hilton's non-answer on state AI rules to Trump accepting a "pinky promise" from AI firms to self-police. [[source]](https://www.cnn.com/2026/09/30/politics/takeaways-cnn-california-governor-debate-becerra-hilton)
      kind: statement
  - name: Steve Hilton
    sort_name: Hilton
    party: R
    status: on_record
    items:
    - text: '"Keep California the AI Capital of the World." It says government should enforce basic accountability but avoid "sweeping, preemptive regulation," and frames AI as a national-security race with China. [[source]](https://stevehiltonforgovernor.com/policy/keep-california-the-ai-capital-of-the-world)'
      kind: platform
    - text: To CalMatters he called AI risk a "very urgent priority" and said he was "very interested" in external safety evaluators, then declined to endorse them. He called a mandatory kill switch "a gimmick." [[source]](https://calmatters.org/politics/2026/09/california-governor-race-ai-safety/)
      kind: statement
    - text: Called industry warnings about human extinction "reckless and irresponsible," saying labs would stop if they truly believed them. [[source]](https://calmatters.org/politics/2026/09/california-governor-race-ai-safety/)
      kind: statement
    - text: Said he would convene an expert AI-safety panel like Newsom's. Would halt AI use in schools on day one and endorsed SB 947 (limits on AI-only firing decisions). [[source]](https://calmatters.org/politics/2026/09/california-governor-race-ai-safety/)
      kind: statement
    - text: At the debate, said his AI priorities are keeping AI jobs in California and protecting children; did not say whether he agrees with Trump's support for industry self-policing. [[source]](https://www.cnn.com/2026/09/30/politics/takeaways-cnn-california-governor-debate-becerra-hilton)
      kind: statement
